
name: AION 2 Patch Notes

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  check-patchnotes:
    runs-on: ubuntu-latest

    steps:
      - name: Repository herunterladen
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Discord Webhook testen
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python - <<'PY'
          import os
          import requests

          url = os.environ["DISCORD_WEBHOOK_URL"]
          response = requests.post(
              url,
              json={
                  "username": "AION 2 Patch Notes",
                  "content": "✅ **AION 2 Patchnotes-Bot ist erfolgreich eingerichtet!**\n\n🇩🇪 Deutsche Patch Notes und Hotfixes werden künftig automatisch gepostet."
              },
              timeout=20
          )
          response.raise_for_status()
          print("Discord-Testnachricht erfolgreich gesendet.")
          PY

      - name: Patch Notes prüfen
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python bot.py

      - name: Verarbeitete Updates speichern
        run: |
          if [ -f seen.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add seen.json
            if ! git diff --cached --quiet; then
              git commit -m "Update processed patch notes"
              git push
            fi
          fi
